# =============================================================================
# cs_nashville.yaml — configuration for the COURSE SCHEDULE pipeline
#
# New district = copy this file, edit the values, change no code.
#
# ORGANISED BY WHEN YOU CAN FILL IT IN.
# You cannot write a column map before you have seen the columns, and you
# cannot choose a teacher-HR mode before you know what the HR file contains.
# The tiers below follow that order, so working top to bottom is the same as
# working in the order the data lets you.
#
#   TIER 0  Before you run anything      · every file the district sent
#   TIER 1  After the raw profile         · column maps, intake, scope
#   TIER 2  Once you understand each file · add-on behaviour, coding, exclusions
#   TIER 3  After the district explains   · bells, terms, weights
#   TIER 4  After you see DB rates        · double-booking settings
#   TIER 5  Reporting choices             · buckets, thresholds, outputs
#
# Stage 01 runs no matter how much of this is blank. The readiness table at the
# top of the report shows which tiers are complete and which still hold
# placeholders.
# =============================================================================

report:
  # How far the pipeline runs. "01" | "02" | "03" | "04" — quoted.
  # Stages after this do not execute. Nothing is written unless it is "04".
  run_through: [
    "01",
    "02",
    "03",
    "04"
  ]

# ###########################################################################
# TIER 0 — BEFORE YOU RUN ANYTHING
# Known from the data request. Fill this in and Stage 01 will run.
# ###########################################################################

district: Metro Nashville Public Schools
year: "2024-25"

helpers_path:        "templates/course_schedule/helpers"
shared_helpers_path: "config/shared"

# Local working locations. The cache holds student-level data, so point it at
# somewhere covered by the data sharing agreement and keep it out of git.
paths:
  cache_dir: null      # null = <repo>/cache/cs_nashville

# The SharePoint folders everything else is relative to.
folders:
  raw:             "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/1. Course Schedule"
  source_of_truth: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/3. Source of Truth"

# EVERY file, in one place. Each names a folder alias from above.
# A source with file: null is declared but not yet supplied — Stage 01 reports
# it as missing and carries on.
#
# Only course_schedule is required. Everything else is optional: the pipeline
# reports the gap rather than failing.
sources:
  course_schedule: { folder: raw,             file: "/0. Raw Data/Courses_Oct2024_FERPA.xlsx" }
  demographics:    { folder: raw,             file: "/0. Raw Data/Demographics_Oct2024_FERPA.xlsx" }
  teacher_hr:      { folder: raw,             file: "/0. Raw Data/HR_Aug2024_INDEMP.xlsx" }
  course_grades:   { folder: raw,             file: "/0. Raw Data/mnps_transcript_snapshot_2425.csv" } # Output from transcript template
  course_coding:   { folder: source_of_truth, file: "/mnps_course_coding_24-25.xlsx" }
  location_coding: { folder: source_of_truth, file: "/mnps_high_schools.xlsx" }


# ###########################################################################
# TIER 1 — AFTER THE RAW PROFILE
# Stage 01 prints every column of every file it could load. That profile is
# what you write this tier against.
# ###########################################################################

# --- Column maps -------------------------------------------------------------
# Format: standard_name: district_column_name
# Left side is what the pipeline expects; right side is what the district
# called it. Every file that gets renamed has a map here, including the
# add-on files — that is what makes them visible during exploration.
column_map:

  course_schedule:
    D_stu_id:            cid
    D_location_id:       meno
    D_course_id:         cou
    D_employee_id:       emp
    D_course_name:       ttl
    D_course_section_id: sec
    D_period:            per
    D_term:              term
    D_term_start:        terms
    D_term_end:          terme
    D_stu_enter_date:    cous
    D_stu_exit_date:     coue
    D_active_flag:       active
    D_primary_flag:      primary

  demographics:
    D_stu_id:            cid
    D_location_id:       meno
    D_stu_grade:         grdyr
    D_stu_race:          raceEthn_federalDesignation
    D_stu_ell_flag:      ell
    D_stu_swd_flag:      sped
    D_stu_poverty_flag:  ed

  # The HR map used to live inside add_ons, where nothing read it — the file
  # went to the add-on unrenamed and the helper looked for a D_ column that did
  # not exist. It now renames on the same path as everything else.
  #
  # Which columns you need depends on the mode you pick in Tier 2:
  #   experience  -> D_employee_id, D_tch_yrs_experience
  #   licensure   -> D_employee_id, D_employee_license_type, D_employee_license_subject
  #   evaluation  -> D_employee_id, D_employee_rating
  teacher_hr:
    D_employee_id:        Empl_ID
    D_tch_yrs_experience: Yrs_Tching_Exp

  # TODO fill in once the grades file is wired up. Needed columns:
  #   D_stu_id, D_course_name, D_course_category, D_course_subject,
  #   D_stu_course_grade
  course_grades:
    D_stu_id:            D_stu_id
    D_course_id:         D_course_id
    D_stu_grade_raw:     D_stu_grade_raw


# --- Intake: how was this data collected? -------------------------------------
intake:
  # "not_snapshot" means the file tracks enrolment over time and needs snapshot
  # dates. "snapshot" means it is already a point-in-time extract.
  enrollment_type: not_snapshot

  # One date per term. A student counts if they entered on or before and had
  # not exited by this date. Pick a stable mid-term date away from the first
  # and last week; the enter/exit distribution in Stage 01 shows you where.
  snapshot_dates:
    Q1: "2024-09-16"
    Q2: "2024-11-18"
    Q3: "2025-02-10"
    Q4: "2025-04-14"


# --- Demographics join --------------------------------------------------------
stu_demographics_join:
  key: D_stu_id
  brings_in: [D_stu_grade, D_stu_race, D_stu_ell_flag, D_stu_swd_flag, D_stu_poverty_flag]

  # Optional value recodes, e.g. "Y"/"N" text to 1/0. Delete if not needed.
  # recode:
  #   D_stu_swd_flag: {"Y": 1, "N": 0}


# --- Derivations: fields the pipeline computes rather than reads ---------------
derivations:
  # Columns set to 0 when null. Typically demographic flags, where blank means
  # "not flagged" rather than "unknown".
  null_to_zero: [D_stu_ell_flag, D_stu_swd_flag, D_stu_poverty_flag]

  # Constant columns. Nashville supplied no rotation data, and every high
  # school runs the same 7-period hybrid block with no rotation, so every
  # meeting sits on rotation "A". A district with real A/B days must supply
  # the column rather than constanting it here.
  constants:
    D_rotation: "A"


# --- Scope: which rows are usable ---------------------------------------------
scope:
  # Drop any row where these are null. Applied AFTER the demographics merge,
  # so naming a demographic field here drops rows that failed to match.
  drop_when_null: ["D_stu_id", "D_stu_grade"]

  # Additional filters as R expressions. A row must satisfy all of them.
  filters:
    - "D_stu_grade >= 9"
    - "D_term != 'Q2' | (!is.na(D_active_flag) & D_active_flag == 1)"


# ###########################################################################
# TIER 2 — ONCE YOU UNDERSTAND WHAT EACH FILE CONTAINS
# Stage 01 has now profiled every file. You can see whether the HR export
# carries years of service or licence types, and you can see the course names
# the coding file has to match.
# ###########################################################################

# --- Add-on behaviour ---------------------------------------------------------
# Files and column maps live in Tiers 0 and 1. What is left here is behaviour.
#
# TEACHER HR — pick the mode from what the file actually contains:
#
#   experience  The file has a years-of-service column. Novice is defined by
#               years <= novice_years_threshold. Simplest and most common.
#
#   licensure   The file has one row per licence held, with a licence type and
#               subject. Needs license_ranks mapping each licence type to a
#               rank, and novice_rank_threshold. Use when the district
#               distinguishes provisional / emergency / professional licences.
#
#   evaluation  The file has a performance rating per teacher. No novice
#               indicator is derived; the rating passes through.
#
# If the HR file has more than one of these, pick the one the analysis needs —
# running two modes is not supported.
add_ons:

  teacher_hr:
    enabled: true
    mode: experience            # experience | licensure | evaluation
    novice_years_threshold: 2   # experience mode: years <= this -> Novice
    # licensure mode only:
    # novice_rank_threshold: 7
    # license_ranks: { Professional: 1, Initial: 3, Provisional: 5, Emergency: 7 }

  course_grades:
    enabled: false              # TODO the file exists; turn on when ready
    grade_mode: percentage      # letter | percentage
    proficiency_threshold_pct: 70  # percentage mode: >= this -> Proficient
    join_keys: [D_stu_id]       # keys for joining proficiency onto student rollup
    credit_recovery_categories: ["Credit Recovery", "SUM Summer School", "VHS"]
    core_subjects: ["English", "Math", "Science", "Social Studies"]


# --- Course coding ------------------------------------------------------------
coding:
  # Which columns join the coding file to the schedule. Must exist in both.
  join_key: [D_course_id, D_course_name]

  # Flag if more than this share of records are still UNCODED after the merge.
  uncoded_flag_threshold_pct: 2

  # Check 2.7: flag time-slots carrying very few distinct courses.
  max_unique_courses: 5


# --- Exclusions ---------------------------------------------------------------
# A record is excluded from a metric if ANY rule for that metric matches.
# Operators: eq, ne, in, not_in. Rules naming a column that does not exist are
# skipped, so a district missing an optional coded field still runs.
#
# Start from these and refine after reading check 2.6, which shows exactly what
# is being dropped and why.
exclusions:
  C_course_time_exclude:
    - { col: C_course_subject_area, op: eq, val: Untracked }
    - { col: C_course_time_of_day,  op: ne, val: "During school" }
    - { col: C_course_subject,      op: eq, val: Internship }
    - { col: C_course_format,       op: eq, val: Virtual }
  C_class_size_and_teacher_load_exclude:
    - { col: C_course_subject_area, op: eq, val: Un-prepped }
    - { col: C_course_subject,      op: in, val: [Maintenance, Internship, Teaching Assistant, Credit Recovery] }
    - { col: C_course_format,       op: eq, val: Virtual }


# ###########################################################################
# TIER 3 — AFTER THE DISTRICT EXPLAINS THE BELL SCHEDULE AND TERMS
# None of this can be inferred from the data alone. Ask for the bell schedule.
# ###########################################################################

# --- What makes a unique class ------------------------------------------------
# Typically school + time + section. Use SECTION, never the teacher: a teacher
# in the recipe hides teacher double-bookings. Check 2.8 validates this.
class_id:
  recipe: [D_location_id, D_employee_id, D_term, D_period, D_course_section_id]


# --- How the schedule encodes time --------------------------------------------
#   "expression"      one column like "3(A-B)" encoding period AND rotation
#   "period_rotation" separate columns for period and rotation
time_format: period_rotation

time_cols:
  expression:      [D_expression]
  period_rotation: [D_period, D_rotation]


# --- Weights ------------------------------------------------------------------
# Weight is dimensionless: the FRACTION of a full schedule a class represents.
# Minutes are separate on purpose (see bell_minutes), so schools with different
# period lengths stay comparable.
weights:
  # What fraction of the year each term covers. Full year 1.0, semester 0.5.
  term:          { Q1: 0.25,      Q2: 0.25,       Q3: 0.25,       Q4: 0.25      }

  # What portion of the year each term spans (0 = start, 1 = end). Used to
  # detect overlapping terms for double-booking.
  term_interval: { Q1: [0, 0.25], Q2: [0.25, 0.5], Q3: [0.5, 0.75], Q4: [0.75, 1] }

  # Which sub-terms each term covers, so a full-year class can conflict with a
  # semester class.
  term_expands:  { Q1: [Q1],      Q2: [Q2],       Q3: [Q3],       Q4: [Q4]      }

  # What fraction of an A/B cycle a rotation represents. Alternating days = 0.5
  # each; no rotation = 1.0. Precedence: by_school > default.
  rotation:
    default: 1                # Nashville: no rotation, one hybrid block schedule
    by_school: {}

  # How many slots one period represents. Usually 1.0; 2.0 only for periods
  # literally twice as long. Precedence: by_period > by_school > default.
  period:
    default: 1.0
    by_period: { MISC: 0, CCR: 0 }
    by_school: {}

# The utilization denominator: each school's real period count from its bell
# schedule. A 7-period day = 7; a block day with advisory might be 4.2.
# Keys must EXACTLY match the names in C_tch_location_name (see check 4.4).
full_utilization:
  default: 5
  by_school: {}


# --- Bell minutes: actual clock time per period -------------------------------
bell_minutes:
  # Nashville: all high schools share a hybrid block. Minutes are averaged over
  # the week (50 on M/W/F, 90 on either Tuesday or Thursday).
  default: 48
  by_school:
    "PUTNAM":   { default: 43 }
    "SCI TECH": { default: 90, overrides: { "8@A": 55, "8@B": 55 } }


# --- Expression grammar -------------------------------------------------------
# How D_expression parses into meetings. Only used when time_format is
# "expression"; harmless otherwise.
expression:
  atoms: []
  expands: {}
  rotations:
    A:     ["A"]
    B:     ["B"]
    "A-B": ["A", "B"]
    AB:    ["A", "B"]


# ###########################################################################
# TIER 4 — AFTER YOU SEE THE DOUBLE-BOOKING RATES
# Check 3.3 shows how many students and teachers are double-booked before
# resolution. These settings decide what to do about it.
# ###########################################################################

# Optional "what-if" filters for the DB analysis ONLY. They temporarily remove
# rows from the DB calculation so you can see the rate without them. They do
# not affect the data. Use [] for none.
db_sizing_filters:
  - { col: D_period, op: in, val: ["MISC", "CCR"] }

# How to handle double-bookings once detected: "full" resolves all, "none"
# skips.
db_resolution:
  student: full
  teacher: full
  class:   full

teacher_db:
  consolidate_max_size: 35                          # max combined size when merging co-taught classes
  exempt_subjects: ["PE/Health", "Art/Music"]       # subjects where teacher DB is expected


# ###########################################################################
# TIER 5 — REPORTING CHOICES
# Nothing here changes a number; it changes how numbers are grouped and what
# leaves the pipeline.
# ###########################################################################

self_contained:
  swd_ell_threshold_pct: 50    # flag classes where SWD+ELL exceeds this share

buckets:
  class_size:   [[0, 6], [7, 12], [13, 18], [19, 24], [25, 30], [31, 35], [36, null]]
  teacher_load: [[0, 34], [35, 74], [75, 124], [125, 199], [200, null]]

# The one-time bootstrap for a district with no coding file yet. Set write:
# true, render once, then set it back.
coding_template:
  write: false
  group_by: [D_course_name, D_course_id]
  file_name: "/1. Coding/To Code/cs_course_coding_template.csv"
  uncoded_fields:
    - C_course_time
    - C_course_subject_area
    - C_course_subject
    - C_course_credit_type
    - C_course_name
    - C_course_rigor
    - C_course_rigor_detail
    - C_course_intervention
    - C_course_time_of_day
    - C_course_format
    - C_course_pathway
    - C_teacher_load_metric
    - C_class_size_metric
    - C_time_metric
    - D_course_ell_flag
    - D_course_swd_flag

outputs:
  folder: raw                      # folder alias from Tier 0
  subfolder: "/2. Processed Data/"
  class_rollup:   { write: true, file_name: "01_cs_class_rollup.xlsx" }
  teacher_rollup: { write: true, file_name: "01_cs_teacher_rollup.xlsx" }
  student_rollup: { write: true, file_name: "01_cs_student_rollup.xlsx" }
  grades_rollup:  { write: true, file_name: "01_cs_course_grades_rollup.xlsx" }
