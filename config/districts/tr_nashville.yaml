# =============================================================================
# tr_nashville.yaml — District config for the TRANSCRIPT pipeline
#
# New district = copy this file, edit the values, change no code.
# If you find yourself editing a file in templates/transcript/ to onboard a
# district, that value should have been in this file.
#
# Values below were confirmed against the source profile run 2026-08-15
# unless marked TODO.
# =============================================================================


# ===========================================================================
# 1. BASICS
# ===========================================================================

district: Metro Nashville Public Schools
year: "2021-22 to 2024-25"

raw_data_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/2. Transcript"
raw_files:
  transcript_raw:    "/0. Raw Data/Transcripts_2122to2425.csv"    # 1,501,192 x 9
  stu_demographics:  "/0. Raw Data/Demographics_2122to2425.csv"   #   119,308 x 11

source_of_truth_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/3. Source of Truth"
source_of_truth_files:
  course_coding:     "/mnps_course_coding_2122_2425.xlsx"
  location_coding:   "/mnps_high_schools.xlsx"

sheets:
  course_coding:     null    # TODO confirm sheet name

drives:
  raw_data:          null
  source_of_truth:   null
  output:            "client_work_drive"


# ===========================================================================
# 2. PATHS
# The cache holds student-level data. Keep it inside the secure area and out
# of git. The supplied .gitignore blocks it; confirm the path is right.
# ===========================================================================

paths:
  cache_dir:  null
  output_dir: null
  output_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/2. Transcript/2. Processed Data"


# ===========================================================================
# 3. COLUMN MAP — standard_name: district_column_name (post clean_names)
# ===========================================================================

column_map:
  transcript:
    D_stu_id:            cid
    D_course_id:         course_number
    D_course_name:       course_name
    D_stu_grade_level:   gradelevel
    D_stu_grade:         percent
    D_creds_earn:        credits_earned
    D_creds_possible:    credits_attempted
    D_start_year:        start_year
    D_end_year:          end_year

  # The coded course file is ERS-produced, so it already uses standard names -
  # janitor::clean_names() only lowercases them. Stage 7 restores the C_ prefix
  # by convention; only the two district-facing join keys need mapping.
  course_coding:
    D_course_id:         d_course_id
    D_course_name:       d_course_name

  demographics:
    D_stu_id:            cid
    D_location_id:       meno
    D_location_name:     school_name
    D_stu_grade_level:   grade
    D_stu_race:          race
    D_stu_ell:           ell
    D_stu_swd:           sped
    D_stu_frl:           ed
    D_stu_enter_date:    edt
    D_stu_exit_date:     wdt
    D_year:              year


# ===========================================================================
# 4. DERIVED FIELDS
# ===========================================================================

derived:
  # CONFIRMED: transcript end_year is 2022-2025, demographics year is 2022-2025,
  # identical value sets. end_year is the school year the row belongs to.
  transcript_year_from: D_end_year

  # CONFIRMED: BOTH date columns arrive as m/d/yyyy. The old script asked for
  # %Y-%m-%d on the exit date, which returned NA for every value.
  date_formats:
    D_stu_enter_date: ["%m/%d/%Y"]
    D_stu_exit_date:  ["%m/%d/%Y"]

  # 75.5% of exit dates are missing. Treated as "still enrolled at year end".
  # TODO confirm this reading with the district before trusting duration.
  force_missing_exit_date: true
  school_year_end_mmdd: "06-30"

  # Clamp enrolment spells to the school year so a multi-year entry date
  # cannot produce a 1,200-day "year".
  clamp_days_to_school_year: true
  school_year_start_mmdd: "08-01"

  # Term is derived; the transcript has no term column.
  # CONFIRMED: the S1/S2 marker is on course_number for 98.9% of rows and on
  # course_name for 96.8%, so the number is tried first and the name is the
  # fallback. Trailing asterisks and a bare " S" are tolerated.
  # RESOLVED: DA/DB are term markers, not sections. Cross-tabbed against the
  # term read from the course name, DA maps to Semester 1 on 92.9% of rows and
  # DB to Semester 2 on 94.2%, with five rows going the other way out of
  # ~10,700. The 749 previously unresolved rows are dual-enrolment names
  # truncated at 29-30 characters, before the S1/S2 survived.
  # DA/DB rules run last so an explicit S1/S2 always wins.
  term_detection:
    sources: [D_course_id, D_course_name]
    rules:
      - { pattern: 'S1\s*\*?\s*$', value: "Semester 1" }
      - { pattern: 'S2\s*\*?\s*$', value: "Semester 2" }
      - { pattern: 'DA\s*\*?\s*$', value: "Semester 1" }
      - { pattern: 'DB\s*\*?\s*$', value: "Semester 2" }

  # Handling of enrolment spells that fall outside the school-year window.
  # 188 rows produced negative days: entry dates of 1-16 July recorded against
  # the year that had just ended.
  #   floor_zero  keep the spell, set days to 0
  #   drop        remove the spell entirely
  #   keep        leave the negative value (it will subtract at Stage 5)
  negative_days_treatment: floor_zero

  # CONFIRMED: the S1/S2 suffix lives on course_number (98.9% of rows), e.g.
  # "ENG1302S1". Stripped to get the base course for the coding join.
  course_id_strip_suffix: '([[:punct:]]?\s*)?(S1|S2)\s*$'

  # School names carry a year stamp and a grade span, and are truncated at
  # ~24 characters: "24-25 Early College High Schoo".
  # The old pattern '[0-9-]' also destroyed real hyphens, turning
  # "Pearl-Cohn High" into "PearlCohn High". These strip only the decoration.
  location_name_strip_prefix: '^[0-9]{2}-[0-9]{2}\s+'
  location_name_strip_suffix: '\s+[0-9]{1,2}-[0-9]{1,2}$'


# ===========================================================================
# 5. VALUE MAPS
# Unmapped codes stop the pipeline rather than passing through silently.
# ===========================================================================

value_maps:
  # CONFIRMED: single letters, no multiracial / two-or-more category present.
  # TODO check with the district whether multiracial students are folded into
  # one of these or omitted.
  D_stu_race:
    A: "Asian"
    B: "Black"
    H: "Hispanic"
    I: "American Indian/Alaska Native"
    P: "Native Hawaiian/Pacific Islander"
    W: "White"

# CONFIRMED integer 0/1 in the raw file. Kept as 0/1 rather than the old
# "Yes"/"No" recode, which made them useless for arithmetic.
flag_columns: [D_stu_ell, D_stu_swd, D_stu_frl]


# ===========================================================================
# 6. SCOPE
# The old config filtered on D_stu_grade, which maps to `percent` — the course
# grade, not the grade level. "D_stu_grade >= 9" kept anyone scoring above 9%.
# ===========================================================================

scope:
  demographics:
    drop_when_null: ["D_stu_id", "D_year", "D_location_id"]
    filters: ["D_stu_grade_level_demo >= 9"]
  transcript:
    drop_when_null: ["D_stu_id", "D_course_id", "D_year"]
    filters: []

# Both files carry a grade level. They are kept apart by name rather than
# colliding into .x / .y at the join, as they did in the old 02 script.
grade_level_names:
  transcript:   D_stu_grade_level_transcript
  demographics: D_stu_grade_level_demo


# ===========================================================================
# 7. PLAUSIBLE RANGES
# action: flag (report only) | na (blank the value) | stop (halt)
# ===========================================================================

# TWO TIERS, because "implausible" and "impossible" are different questions.
#
#   plausible  the range you would expect. Values outside are counted and
#              reported, never halt. Grades of 100.05 are extra credit, not
#              errors, so this tier is a description of the data, not a gate.
#
#   hard       the range beyond which a value cannot be a real measurement.
#              Set hard_tolerance_pct to turn this into a gate: the run stops
#              when more than that share falls outside. Set hard_action to na
#              to blank those values so they cannot poison a mean.
#
# hard_tolerance_pct is deliberately unset on the first pass — read the
# distributions in the report, then choose the bounds.
ranges:
  # RESOLVED from the tail distribution: 35,629 rows sit above 100, but the
  # distribution effectively ends at 110 — [105,110) holds 1,019 rows and
  # [110,120) holds 2. Above 110 there are 16 rows in total.
  # 110 is therefore an empirically clean cut. The raw value is preserved in
  # D_stu_grade_raw before anything is blanked.
  D_stu_grade:
    plausible: { min: 0, max: 100 }
    hard:      { min: 0, max: 110 }
    hard_action: na            # flag | na | stop
    hard_tolerance_pct: 0.05

  D_creds_earn:
    plausible: { min: 0, max: 2 }
    hard:      { min: 0, max: 10 }
    hard_action: flag
    # hard_tolerance_pct: 0.1

  D_creds_possible:
    plausible: { min: 0, max: 2 }
    hard:      { min: 0, max: 10 }
    hard_action: flag
    # hard_tolerance_pct: 0.1

  M_days_enrolled:
    plausible: { min: 0, max: 366 }
    hard:      { min: 0, max: 400 }
    hard_action: flag
    hard_tolerance_pct: 0.1

# Buckets used to describe the tail above the plausible maximum for grades.
grade_tail_buckets: [100, 100.5, 101, 102, 105, 110, 120, 150, 200, 1000]

# CREDITS EARNED EXCEEDING CREDITS ATTEMPTED
# Tettra has no guidance on this, so it is a logged decision rather than an
# inherited rule.
#
# Nashville shows three distinct patterns, and they deserve different answers:
#   0.5 -> 1.0    7,072 rows. Regular enough to be a convention, not an error.
#   0.0 -> 0.5    ~400 rows. Attempted defaulted to zero.
#   0.5 -> >2     ~19 rows. Not a usable credit value.
#
# treatment applies to every row where earned > attempted:
#   flag        add C_creds_earn_exceeds_attempted, change nothing
#   na_earned   blank the earned figure
#   drop        remove the row (loses the enrolment record — not recommended)
#
# impossible_above sets the point beyond which the credit figure cannot be
# real. The enrolment is still real, so na is preferred to drop: the student
# did take the course, we just cannot use the number.
credits:
  # RESOLVED: not an error. 95.5% of these rows are Semester 2 records where the
  # student's Semester 1 row for the same base course earned zero - the S2
  # record carries the recovered credit as well as its own. The earned figure
  # is correct; flag and keep.
  earned_exceeds_attempted:
    treatment: flag              # flag | na_earned | drop
  impossible_above: 2            # earned above this is not a usable value
  impossible_treatment: na       # na | drop | keep

# COURSE NAME MARKERS
# The asterisk marks something, and credit recovery is one case of it: 95.5% of
# the S2 rows earning more credit than they attempted have an S1 row that
# earned zero. But 46,780 rows carry an asterisk against only 6,889 showing
# excess credit, so the marker is broader than recovery alone - most likely a
# repeat or grade-replacement flag. Section 3.4 profiles it.
# TODO confirm the meaning with the district.
course_name_markers:
  repeat_or_recovery_pattern: '[*]'


# ===========================================================================
# 8. COHORT DEFINITION
# Previously hardcoded in two places that disagreed.
# ===========================================================================

cohort:
  entry_year:         2022
  entry_grade:        9
  years_required:     4
  final_year:         2025

  # DURATION
  # basis: days  -> M_days_enrolled_year >= duration_min_days
  #        share -> days as a share of the school-year window >= duration_min_share
  #
  # Tettra expresses the rule as "at least 75% of the school year", which on a
  # 334-day window is about 250 days. The inherited 200 is roughly 60%, and for
  # the 75.5% of rows with an imputed exit date it reduces to "enrolled on or
  # before 12 December". Basis stays on days to preserve the current
  # definition; switching to share applies the Tettra rule instead.
  # TODO decide which definition the project is using, and record it.
  duration_basis:     days           # days | share
  duration_min_days:  200
  duration_min_share: 0.75
  duration_rule:      all_years      # all_years | bookends | none

  progression:
    2022: 9
    2023: 10
    2024: 11
    2025: 12
  progression_rule:   all_years      # all_years | bookends | none

  # CONFIRMED: 11,142 student-years have 2+ demographics rows, of which ~10,689
  # are genuinely multi-school. ~450 are repeat spells at the same school.
  days_enrolled_rule: sum_of_spells  # sum_of_spells | max_spell

  home_school_tiebreak: prefer_included

  # STARTING UNIVERSE for the attrition funnel.
  #   entry_grade_any_school -> every student in the entry grade, district-wide
  #   entry_grade_in_scope   -> only those whose entry-year home school is one
  #                             of schools_to_include
  #
  # in_scope is the more meaningful denominator: starting district-wide makes
  # the school criterion do two jobs at once, removing students who were never
  # at a cohort school alongside those who left one. It also makes the Tettra
  # retention benchmarks comparable, since those were computed on an in-scope
  # universe.
  #
  # Note this uses the HOME school - the one holding the most days that year.
  # A student splitting the entry year between an out-of-scope and an in-scope
  # school, with more days at the former, starts outside the universe.
  universe_rule: entry_grade_in_scope  # entry_grade_any_school | entry_grade_in_scope

  # In which years the home school must be one of schools_to_include.
  school_rule: in_scope_all_years    # in_scope_all_years | in_scope_entry_year | in_scope_any_year

  # Which school a cohort student is attributed to across the whole span.
  four_year_school_rule: most_days   # most_days | entry_year | final_year | modal

  # Tettra retention benchmarks from Lubbock, for comparison at each step.
  benchmarks:
    step_retention_pct:     85
    snapshot_retention_pct: 86

  # Tettra says early graduates are included. This extract has no graduation
  # indicator - only enrolment - so a three-year graduate fails the four-year
  # rule and cannot be told apart from a student who left.
  # TODO request a graduation date or status field from the district.
  include_early_graduates: true

  # Resolved to location_id (meno) at Stage 2 and matched by code thereafter.
  # Names are the human-readable interface only.
  #
  # CONFIRMED against all 162 raw name values:
  #   - "Hillwood High" is correct. "Hillwood High School" does not exist in
  #     the data, so the old 03 script silently dropped Hillwood entirely.
  #   - James Lawson appears as "James Lawson High" in 23-24 and
  #     "James Lawson High School" in 24-25. Both are real; aliased below.
  #   - James Lawson has no 21-22 or 22-23 enrolment; the school opened in
  #     23-24, so no cohort member can have it as a home school for 4 years.
  # LOCATION MERGES — locations that are one institution across time.
  # Applied BEFORE the crosswalk is built, so schools_to_include names only the
  # surviving location. Raw D_location_id is preserved; C_location_id carries
  # the merged code that all downstream logic uses.
  #
  # Checked, not assumed: each name must resolve to exactly one code, and the
  # merged locations must not operate in the same year. Two schools running
  # concurrently are two schools; set allow_overlap: true to override.
  location_merges:
    - name: "James Lawson High"
      absorbs: ["Hillwood High"]
      effective_year: 2024
      allow_overlap: false
      reason: "Total campus relocation. MNPS moved all non-graduating students
               and the teaching staff from the Hillwood building to the new
               Bellevue facility for August 2023 (SY23-24), opening with roughly
               1,200 students previously zoned for or attending Hillwood. The
               two codes describe one continuous institution, so a student's
               move between them is not a transfer."

  # Names are the human-readable interface only; they resolve to codes at
  # Stage 2 and everything downstream matches on the code.
  #
  # CONFIRMED against all 162 raw name values:
  #   - "Hillwood High" is correct; "Hillwood High School" does not exist in the
  #     data, so the old 03 script silently dropped Hillwood entirely.
  #   - James Lawson appears as "James Lawson High" in 23-24 and "James Lawson
  #     High School" in 24-25. Both are real; aliased below.
  #   - Hillwood is absent from this list because it merges into James Lawson
  #     above, which then covers all four years.
  schools_to_include:
    - "Antioch High School"
    - "Cane Ridge High School"
    - "Glencliff High School"
    - "Hillsboro High"
    - "Hunters Lane High"
    - "James Lawson High"
    - "John Overton High"
    - "Maplewood High"
    - "McGavock High"
    - "Pearl-Cohn High"
    - "Stratford"
    - "Whites Creek High School"

  school_name_aliases:
    "James Lawson High School": "James Lawson High"

  # SCHOOL PRESENCE ACROSS YEARS
  # A missing school-year is sometimes a data problem and sometimes a fact about
  # the district; the pipeline cannot tell. Declare exceptions here and an
  # undeclared gap stops the run.
  #
  # Nashville needs no overrides once Hillwood merges into James Lawson, since
  # the merged location then spans 2022-2025. Shape retained as documentation:
  #
  #   overrides:
  #     "Some High School":
  #       years: [2023, 2024, 2025]
  #       reason: "Opened SY22-23."
  school_year_expectations:
    default: all_years
    overrides: {}

  # CREDIT RECOVERY SITES
  # RESOLVED: these already carry the PARENT school's location code (e.g.
  # "S2022 CR Cane Ridge HS" is code 182, same as Cane Ridge High School), so
  # matching on the code rolls them up automatically. The flag is retained so
  # those rows stay identifiable.
  credit_recovery_name_pattern: '^S[0-9]{4}\s+CR\s+'
  credit_recovery_treatment: map_to_parent   # exclude | map_to_parent | include

# ===========================================================================
# 8b. COLLAPSING ENROLMENT SPELLS TO ONE ROW PER STUDENT-YEAR
# ===========================================================================

student_year_collapse:
  # Which school counts as the student's school for the year.
  home_school_rule: most_days      # most_days | first_spell | last_spell

  # Applied when two schools tie on days. prefer_included breaks toward a
  # school in schools_to_include; remaining ties fall to lowest location code,
  # which is arbitrary but deterministic across runs.
  tiebreak: prefer_included        # prefer_included | lowest_id | earliest

  # A student flagged ELL at one school and not the other in the same year.
  # 'any' treats the year as flagged if any spell is; 'home_school' takes the
  # value from the home-school spell only.
  flag_rule: any                   # any | home_school

  # Grade level for the year.
  grade_level_rule: home_school    # home_school | modal | max


# ===========================================================================
# 8c. COURSE CODING JOIN
# ===========================================================================

coding_join:
  keys: [D_course_id, D_course_name]

  # Rows whose ID + name pair misses may fall back to the course ID alone, but
  # only where that ID maps to exactly one coded course. BUS3718S1 answers to
  # four different names, so an unconditional ID fallback would hand it an
  # arbitrary coding. Rows resolved this way are flagged.
  fallback: id_when_unambiguous     # none | id_when_unambiguous

  # Coded columns that must be present after the join, or the coded file is
  # not what the pipeline expects.
  required_coded_fields:
    - C_course_subject_area
    - C_course_subject
    - C_course_credit_type
    - C_course_rigor


# ===========================================================================
# 8d. ANALYSIS FIELDS ADDED TO THE OUTPUT
# Computed once here, with checks, rather than recomputed in each analysis.
# ===========================================================================

analysis_fields:
  # Grade buckets, evaluated top-down; first match wins.
  grade_pct_buckets:
    - { min: 90,  label: "90+" }
    - { min: 80,  label: "80-89" }
    - { min: 70,  label: "70-79" }
    - { min: 60,  label: "60-69" }
    - { min: 0,   label: "Below 60" }

  # A course is failed when credit was attempted and none earned.
  fail_rule: zero_earned_with_credit_attempted

  # Credit recovery. The legacy script required a prior failed attempt AND a
  # grade of exactly 60, which hardcodes the district's minimum passing mark.
  # This uses the evidence instead: a later-term row earning more credit than
  # it attempted, where the same student's earlier-term row for the same base
  # course earned zero. That test confirmed 95.5% on Nashville.
  credit_recovery_rule: excess_credit_after_failure


# ===========================================================================
# 8e. SNAPSHOT — an optional single-year selection
# Independent of the cohort. Set enabled: false for a cohort-only project.
# ===========================================================================

snapshot:
  enabled: true
  year: 2025
  grade_levels: [9, 10, 11, 12]

  require_school_in_scope: true

  # NOTE the legacy script compared M_days_enrolled (calendar days) against
  # 0.75 * 180 = 135 (instructional days), which is a unit mismatch, and it
  # computed the sum without group_by so every student received the same
  # value. Both are corrected here; the threshold is declared plainly.
  duration_basis:     days      # days | share | credits_attempted
  duration_min_days:  200
  duration_min_share: 0.75
  credits_attempted_min: 4      # used only when duration_basis is credits_attempted


# ===========================================================================
# 8f. OUTPUTS
# ===========================================================================

outputs:
  # File names carry the subfolder, matching the raw_files convention:
  # folder_path is the district root, the name supplies the rest of the path.
  subfolder: "/2. Processed Data/"

  coded_transcript:
    write: true
    file_name: "mnps_transcript_coded_2122_2425.csv"

    # Which rows leave the pipeline.
    #   all                -> every transcript row (~1.5M for Nashville)
    #   cohort_only        -> rows for cohort students
    #   cohort_or_snapshot -> either selection, so one file serves both
    #
    # cohort_only also removes every orphan row as a side effect: a cohort
    # student is enrolled in all required years by definition, so no
    # transferred-in coursework, no missing home school, no missing
    # demographics. Every row in the export is fully populated.
    #
    # The cost is that changing the cohort definition means re-running the
    # pipeline. With the local cache that is a fast re-render, not a re-read.
    rows: cohort_only        # all | cohort_only | cohort_or_snapshot

    # Keep a cohort student's full transcript, including any year outside the
    # cohort window. Moot for Nashville, where the data spans exactly the four
    # cohort years, but it matters for a district supplying more years.
    restrict_to_cohort_years: false

  # THE DENOMINATOR FILE. Tettra's method keeps every student and distinguishes
  # with a flag - "9th graders who attended a high school in the district for
  # any amount of time: these are all the students in the data file" - and asks
  # that the cohort be tested for comprehensiveness against that population.
  # A cohort-only transcript cannot answer that. This can, at student-year
  # grain, which is roughly 107k narrow rows rather than 1.5M wide ones.
  student_year:
    write: true
    file_name: "mnps_student_year_2122_2425.csv"

  # A convenience export of the same table filtered to the snapshot. The main
  # table already carries C_stu_snapshot_include, so the two cannot drift.
  snapshot:
    write: true
    file_name: "mnps_transcript_snapshot_2425.csv"


# ===========================================================================
# 9. THRESHOLDS — the numbers that trip a structural check
# ===========================================================================

thresholds:
  # CONFIRMED at Stage 3.6: exact ID + name matching reaches 99.99% of rows
  # (1,501,066 of 1,501,191). 99.5 leaves room for a future extract to drift
  # without tripping on noise.
  min_course_coding_match_pct: 99.5

  # Rows whose ID+name pair misses may fall back to course ID alone, but only
  # where that ID maps to exactly one coded course. BUS3718S1 answers to four
  # different names, so an unconditional ID fallback would assign it an
  # arbitrary coding.
  coding_id_fallback: true

  # Share of transcript student-YEARS that must find a demographics record.
  # The student-year is the real join key, not the student.
  #
  # TODO set from evidence. The first run matched ~96.1%: 3,958 of ~101,400
  # transcript student-years had no enrolment record. Every one of those
  # students IS in demographics, just not for that year — consistent with
  # transferred-in credit from a prior school. Section 4.2 profiles them.
  # Set this once that profile is understood.
  min_student_year_match_pct: 90
  min_student_match_pct: 99         # CONFIRMED 100% of transcript students
                                    # appear in demographics


# ===========================================================================
# 10. TRACING — students followed by hand through every stage
# ===========================================================================

# PROJECT TEAM ACTION: Identify students to trace throughout the pipeline that
# fit different student profiles:
##   -  Gen ed student: typical course progression
##   -  English learner
##   -  Student with IEP
##   -  Student in advanced courses (e.g., AP, IB, Cambridge)
##   -  Student with course failures and/or credit recovery courses
##   -  Student with work-based learning courses
##   -  Student with dual enrollment courses

tracing:
  students:
    - 190137047
    - 190173946
    - 190162750
    - 190181214
  random_n: 5
  seed: 123
