# =============================================================================
# tr_nashville.yaml — District config for the TRANSCRIPT pipeline
#
# New district = copy this file, edit the values, change no code.
# Anything district-specific belongs here. If you find yourself editing a file
# in R/ to onboard a district, that value should have been in this file.
#
# Lines marked TODO need a decision from you before the pipeline is trusted.
# =============================================================================


# ===========================================================================
# 1. BASICS
# ===========================================================================

district: Metro Nashville Public Schools
year: "2021-22 to 2024-25"

raw_data_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/2. Transcript"
raw_files:
  transcript_raw:    "/0. Raw Data/Transcripts_2122to2425.csv"
  stu_demographics:  "/0. Raw Data/Demographics_2122to2425.csv"

source_of_truth_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/3. Source of Truth"
source_of_truth_files:
  course_coding:     "/mnps_course_coding_2122_2425.xlsx"   # the final ERS-coded file
  location_coding:   "/mnps_high_schools.xlsx"

# Sheet names for Excel sources. Omit or leave null for the first sheet.
sheets:
  course_coding:     null                                    # TODO confirm

# SharePoint drive per source group. Omit a key to use the default drive.
drives:
  raw_data:          null
  source_of_truth:   null
  output:            "client_work_drive"


# ===========================================================================
# 2. PATHS — local working locations
# Cache holds student-level data. Keep it inside your secure area and
# out of git (see .gitignore).
# ===========================================================================

paths:
  cache_dir:  null    # null = <repo>/cache/nashville
  output_dir: null    # null = <repo>/output/nashville
  output_folder_path: "Other/Arnold Ventures/2026 Pathways ROI Tools/1. Data & Analysis - Secure/1. For Positron/1. Nashville/2. Transcript/2. Processed Data"


# ===========================================================================
# 3. COLUMN MAP — standard_name: district_column_name
# Right-hand values are post-janitor::clean_names(), i.e. snake_case.
# ===========================================================================

column_map:
  transcript:
    D_stu_id:            cid
    D_course_id:         course_number
    D_course_name:       course_name
    D_stu_grade_level:   gradelevel
    D_stu_grade:         percent
    D_creds_earn:        credits_earned
    D_creds_possible:    credits_attempted
    D_start_year:        start_year
    D_end_year:          end_year

  demographics:
    D_stu_id:            cid
    D_location_id:       meno
    D_location_name:     school_name
    D_stu_grade_level:   grade
    D_stu_race:          race
    D_stu_ell:           ell
    D_stu_swd:           sped
    D_stu_frl:           ed
    D_stu_enter_date:    edt
    D_stu_exit_date:     wdt
    D_year:              year


# ===========================================================================
# 4. DERIVED FIELDS — things the pipeline builds rather than reads
# ===========================================================================

derived:
  # The transcript file has no year column. D_year is created from this one so
  # it can join to demographics on student + year.
  # TODO confirm D_end_year is the right school year for a transcript row.
  transcript_year_from: D_end_year

  # Date parsing formats. Enter/exit arrive in different formats in the
  # Nashville demographics export.
  date_formats:
    D_stu_enter_date: "%m/%d/%Y"
    D_stu_exit_date:  "%Y-%m-%d"

  # Students with no exit date are treated as enrolled to the end of the year.
  force_missing_exit_date: true
  school_year_end_mmdd: "06-30"

  # Term is read off the course name suffix, since the transcript has no term
  # column. Rules are applied in order; first match wins.
  term_from_course_name:
    - { pattern: "S1", value: "Semester 1" }
    - { pattern: "S2", value: "Semester 2" }

  # Suffix stripped from transcript course IDs before matching the coded file.
  course_id_strip_suffix: '([[:punct:]]?\s*)?(S1|S2)\s*$'

  # Location names carry numbers in the demographics export; strip for matching.
  location_name_strip_pattern: '[0-9-]'


# ===========================================================================
# 5. SCOPE — which rows are usable at all
# ===========================================================================

scope:
  drop_when_null: ["D_stu_id", "D_stu_grade_level"]
  filters: ["D_stu_grade_level >= 9"]


# ===========================================================================
# 6. COHORT DEFINITION
# Previously hardcoded across 02 and 03 in two places that disagreed.
# ===========================================================================

cohort:
  entry_year:         2022    # D_year in which the cohort is in entry_grade
  entry_grade:        9
  years_required:     4
  final_year:         2025

  # Duration: minimum days enrolled to count a year as "present".
  duration_min_days:  200
  duration_rule:      all_years    # all_years | bookends | none

  # Progression: expected grade level by year.
  progression:
    2022: 9
    2023: 10
    2024: 11
    2025: 12
  progression_rule:   all_years    # all_years | bookends | none

  # M_days_enrolled had three competing definitions across the old scripts
  # (exit-enter, sum of unique per student-year, max per student-year).
  # This pins it to one. See notes in the .qmd.
  # TODO confirm: sum is right if enrolment spells are non-overlapping.
  days_enrolled_rule: sum_of_spells   # sum_of_spells | max_spell

  # Home school = school with the most days enrolled that year; ties broken by
  # preferring a school in schools_to_include, then at random with the seed below.
  home_school_tiebreak: prefer_included

  # Canonical school names. Aliases below are collapsed to these first, so a
  # spelling variant cannot silently drop a school.
  # TODO the old scripts disagreed: 02 had "Hillwood High", 03 had
  #      "Hillwood High School". Confirm which is the real name in the data.
  schools_to_include:
    - "Antioch High School"
    - "Cane Ridge High School"
    - "Glencliff High School"
    - "Hillsboro High"
    - "Hillwood High"
    - "Hunters Lane High"
    - "James Lawson High"
    - "John Overton High"
    - "Maplewood High"
    - "McGavock High"
    - "PearlCohn High"
    - "Stratford"
    - "Whites Creek High School"

  school_name_aliases:
    "James Lawson High School": "James Lawson High"
    "Hillwood High School":     "Hillwood High"


# ===========================================================================
# 7. THRESHOLDS — the numbers that trip a structural check
# ===========================================================================

thresholds:
  # Course coding join. Below this share of transcript rows matched, stop.
  # TODO set the real number once we see the first match rate at Stage 8.
  min_course_coding_match_pct: 95

  # Share of transcript students that must also appear in demographics.
  min_student_match_pct: 95


# ===========================================================================
# 8. TRACING — students followed by hand through every stage
# Replaces the hardcoded IDs scattered through the old scripts.
# ===========================================================================

tracing:
  students:
    - 190137047
    - 190173946
    - 190162750
    - 190181214
  random_n: 5
  seed: 123


# ===========================================================================
# ===========================================================================
# NOT USED BY THE TRANSCRIPT PIPELINE
# Retained from the original file for the master schedule / class size work.
# Nothing below this line is read by transcript_pipeline.qmd.
# ===========================================================================
# ===========================================================================

coding:
  join_key: [D_course_id, D_course_name]
  uncoded_flag_threshold_pct: 2
  max_unique_courses: 5

exclusions:
  C_course_time_exclude:
    - { col: C_course_subject_area, op: eq, val: Untracked }
    - { col: C_course_time_of_day,  op: ne, val: "During school" }
    - { col: C_course_subject,      op: eq, val: Internship }
    - { col: C_course_format,       op: eq, val: Virtual }
  C_class_size_and_teacher_load_exclude:
    - { col: C_course_subject_area, op: eq, val: Un-prepped }
    - { col: C_course_subject,      op: in, val: [Maintenance, Internship, Teaching Assistant, Credit Recovery] }
    - { col: C_course_format,       op: eq, val: Virtual }

class_id:
  recipe: [D_location_id, D_employee_id, D_term, D_period, D_course_section_id]

time_format: period_rotation
time_cols:
  expression:      [D_expression]
  period_rotation: [D_period, D_rotation]

weights:
  term:          { Q1: 0.25, Q2: 0.25, Q3: 0.25, Q4: 0.25 }
  term_interval: { Q1: [0, 0.25], Q2: [0.25, 0.5], Q3: [0.5, 0.75], Q4: [0.75, 1] }
  term_expands:  { Q1: [Q1], Q2: [Q2], Q3: [Q3], Q4: [Q4] }
  rotation:
    default: 1
    by_school: {}
  period:
    default: 1.0
    by_period: { MISC: 0, CCR: 0 }
    by_school: {}

bell_minutes:
  default: 48
  by_school:
    "PUTNAM":   { default: 43 }
    "SCI TECH": { default: 90, overrides: { "8@A": 55, "8@B": 55 } }

db_sizing_filters:
  - { col: D_period, op: in, val: ["MISC", "CCR"] }

expression:
  atoms: []
  expands: {}
  rotations:
    A:     ["A"]
    B:     ["B"]
    "A-B": ["A", "B"]
    AB:    ["A", "B"]

db_resolution:
  student: full
  teacher: full
  class:   full

teacher_db:
  consolidate_max_size: 35
  exempt_subjects: ["PE/Health", "Art/Music"]

self_contained:
  swd_ell_threshold_pct: 50

buckets:
  class_size: [[0, 6], [7, 12], [13, 18], [19, 24], [25, 30], [31, 35], [36, null]]
